<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cronómetro</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container-cronometro">
        <button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
        
        <h1>⏱️ Cronómetro</h1>
        
        <p id="temporizador">0.00</p>
        
        <div class="button-group">
            <button type="button" class="btn-custom btn-iniciar" id="iniciarS">Iniciar/Stop</button>
            <button type="button" class="btn-custom btn-resetear" id="resetear">Resetear</button>
            <button type="button" class="btn-custom btn-grabar" id="grabar">Grabar</button>
        </div>
        
        <div class="tiempos-section">
            <h5>📊 Tiempos Grabados</h5>
            <div id="almacenarTiempos">
            </div>
        </div>
    </div>


    <script src="cronometro.js"></script>
</body>

</html>
